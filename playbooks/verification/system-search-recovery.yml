$schema: ../schemas/verification.v1.json
schema_version: verification-procedure.v1
id: system-search-recovery
version: 1
name: Verify the system is back in search and zone listings
mode: verification
checks:
  - id: search-consistency
    tool: search_consistency
    criterion: evidence_present
    io_timeout_seconds: 15
    requires: [system_id]
policy:
  retry_interval_seconds: 60
  max_attempts: 3
  timeout_seconds: 900
  failure_outcome: escalate
